name: Release

on:
  release:
    types: [created]

jobs:
  sonar_analysis:
    uses: eclipse-ecsp/.github/.github/workflows/workflow-sonar-analysis.yml@rw-v1
    name: Sonar Analysis
    secrets:
      token: ${{ secrets.SONAR_TOKEN }}
    with:
      java_version: '25'
      java_distribution: 'temurin'
  licence_compliance_status:
    needs: sonar_analysis
    uses: eclipse-ecsp/.github/.github/workflows/workflow-licences-analysis.yml@rw-v1
    name: Check Licence Compliance Status
    with:
      java_version: '25'
      java_distribution: 'temurin'
      create-review: false

  extract_version:
    runs-on: ubuntu-latest
    needs: licence_compliance_status
    name: Extract release version without v prefix
    outputs:
      release_version: ${{ steps.extract.outputs.release_version }}
    steps:
    - uses: eclipse-ecsp/.github/.github/actions/extract-version@rw-v1
      id: extract

  publish_artifacts:
    needs: extract_version
    uses: eclipse-ecsp/.github/.github/workflows/workflow-publish-artifacts.yml@rw-v1
    secrets:
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      CENTRAL_SONATYPE_TOKEN_USERNAME: ${{ secrets.CENTRAL_SONATYPE_TOKEN_USERNAME }}
      CENTRAL_SONATYPE_TOKEN_PASSWORD: ${{ secrets.CENTRAL_SONATYPE_TOKEN_PASSWORD }}
    with:
      java_version: '25'
      java_distribution: 'temurin'
      release_version: ${{ needs.extract_version.outputs.release_version }}

  update_next_version:
    needs: extract_version
    uses: eclipse-ecsp/.github/.github/workflows/workflow-update-next-version.yml@rw-v1
    with:
      version: ${{ needs.extract_version.outputs.release_version }}
      java_version: '25'
      java_distribution: 'temurin'
    secrets:
      ECSP_BOT_PAT: ${{ secrets.ECSP_BOT_PAT }}
    permissions:
      pull-requests: write
      contents: write
